services:
  db:
    image: postgres:15-alpine
    container_name: omniqueue_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omniqueue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-omniqueue}
    # Loopback only. Docker publishes to 0.0.0.0 by default, which would put the
    # database on the LAN with whatever password .env carries.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - omni_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omniqueue}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: omniqueue_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - omni_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  omni_internal:
    driver: bridge

volumes:
  pgdata:
  redis_data:

